# Based on GTSAM file (by @ProfFan)
name: CI Build colcon (ROS1 Noetic)

on: [push, pull_request]

jobs:
  build_noetic:
    runs-on: ubuntu-latest
    env:
      DEBIAN_FRONTEND: noninteractive
    strategy:
      matrix:
        include:
          - docker_image: ros:noetic-ros-base
            ros_distribution: noetic
            use_ros_testing: false

    container:
      image: ${{ matrix.docker_image }}

    steps:
      - name: Install git and dependencies
        run: |
          apt-get update -qq
          apt-get install -y git python3-colcon-common-extensions python3-rosdep

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup rosdep
        run: |
          rosdep init --rosdistro=noetic || true
          rosdep update --rosdistro=noetic

      - name: Install package dependencies
        run: |
          . /opt/ros/${{ matrix.ros_distribution }}/setup.sh
          rosdep install --rosdistro=noetic --from-paths . --ignore-src -r -y

      - name: Build with colcon
        run: |
          . /opt/ros/${{ matrix.ros_distribution }}/setup.sh
          colcon build --symlink-install --event-handlers console_direct+

      - name: Run unit tests
        run: |
          . /opt/ros/${{ matrix.ros_distribution }}/setup.sh
          colcon test --event-handlers console_direct+
          colcon test-result --verbose
