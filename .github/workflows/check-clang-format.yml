name: CI clang-format

on: [push, pull_request]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # Github Actions requires a single row to be added to the build matrix.
        # See https://help.github.com/en/articles/workflow-syntax-for-github-actions.
        name: [clang-format-check]

        include:
          - name: clang-format-check
            os: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # clang-format-14 is no longer packaged for recent Ubuntu runners, so it
      # comes from PyPI, in a venv that also holds the linter requirements:
      - name: Install Dependencies
        run: |
          python3 -m venv "$HOME/lint-venv"
          "$HOME/lint-venv/bin/pip" install -q clang-format==14.0.6 -r .github/python_clang_format_reqs.txt
          ln -sf "$HOME/lint-venv/bin/clang-format" "$HOME/lint-venv/bin/clang-format-14"
          echo "$HOME/lint-venv/bin" >> "$GITHUB_PATH"

      - name: Check code style
        run: |
          clang-format-14 --version
          bash .github/check_style.sh
